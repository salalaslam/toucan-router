name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: router tests
        run: uv venv && uv pip install -e . pytest && .venv/bin/python -m pytest -q
      - name: bot tests
        working-directory: bot
        run: uv venv && uv pip install -e '.[test]' && .venv/bin/python -m pytest -q
      - name: tools tests
        working-directory: tools
        run: uv venv && uv pip install -e '.[test]' && .venv/bin/python -m pytest -q

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: personal data patterns
        run: python3 scripts/check-generic-pii
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
