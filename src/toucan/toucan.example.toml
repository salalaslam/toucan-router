[settings]
owner_name = "the owner"
timezone = "UTC"
upload_command = "toucan-upload-loom"  # Loom requires toucan-tools
# alert_url = "https://alerts.example.com/topic"
# alert_url_file = "~/.config/toucan/alert-url"  # mode 600
# owner_teams_id = "00000000-0000-0000-0000-000000000000"
owner_whatsapp = ""  # your phone JID, such as 15550000000@s.whatsapp.net
rewake_minutes = 15
wake_gap_minutes = 2
max_wakes = 3
claimed_stale_hours = 4
done_unclosed_minutes = 30
whatsapp_stale_minutes = 120
rate_per_hour = 20
context_hours = 24
ack_alert_minutes = 5
fallback_minutes = 5
rotate_tokens = 200000       # ask idle owner threads to hand over at this context size
rotate_stall_minutes = 60    # alert if a handover has not finished by then
# transcribe = "chatgpt-transcribe"   # voice notes become text before they reach a thread

[people.alice]
name = "Alice Example"
role = "pm"
teams_id = "00000000-0000-0000-0000-000000000001"
whatsapp = ["15550000001@s.whatsapp.net", "100000000000001@lid"]
email = ["alice@example.com"]

# [people.someone]
# name = "Another requester"
# teams_id = "ENTRA-OBJECT-ID"
# whatsapp = ["15550000002@s.whatsapp.net"]

[threads.project-a]
t3_thread = "11111111-1111-1111-1111-111111111111"   # optional fallback; the hook determines the live thread
project = "project-a"
hook_file = "~/.config/toucan/hooks/project-a.hook"
# rotate_tokens = 300000   # override the context limit for this thread
# fallback = "standby"   # takes this thread's requests while it is stopped by a rate limit

# [threads.standby]   # put it on the other provider
# t3_thread = "T3-THREAD-ID"
# project = "toucan"
# hook_file = "~/.config/toucan/hooks/standby.hook"

[[routes]]
name = "alice-whatsapp"
label = "WhatsApp: Alice"
source = "whatsapp"
chats = ["15550000001@s.whatsapp.net", "100000000000001@lid"]
thread = "project-a"
mode = "act"
requesters = ["alice"]
active_from = "2026-10-17T00:00:00+00:00"

