[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "toucan-router-tools"
version = "0.1.0"
description = "Optional Loom and Google Sheets tools for Toucan Router."
readme = {text = "Optional tools for Toucan Router. See the project homepage for setup instructions.", content-type = "text/plain"}
license = "MIT"
license-files = ["LICENSE"]
keywords = ["toucan", "loom", "sheets"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Operating System :: POSIX :: Linux"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/salalaslam/toucan-router"
Repository = "https://github.com/salalaslam/toucan-router"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
toucan-upload-loom = "toucan_router_tools.upload_loom:main"
toucan-sheets = "toucan_router_tools.sheets:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toucan_router_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
