[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "toucan-teams-bot"
version = "0.2.0"
description = "Teams bot for Toucan Router: receive approved requests and post replies."
readme = {text = "Teams bot for Toucan Router. See the project homepage for setup instructions.", content-type = "text/plain"}
license = "MIT"
license-files = ["LICENSE"]
keywords = ["teams", "bot", "toucan", "agents"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Operating System :: POSIX :: Linux"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "microsoft-teams-apps==2.1.1",
  "microsoft-teams-api==2.1.1",
  "microsoft-teams-common==2.1.1",
  "pillow>=11",
  "markdown-it-py[linkify]>=3,<5",
]

[project.urls]
Homepage = "https://github.com/salalaslam/toucan-router"
Repository = "https://github.com/salalaslam/toucan-router"

[project.optional-dependencies]
test = ["pytest>=8", "httpx"]

[project.scripts]
toucan-bot = "toucan_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toucan_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
